name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The file-scoped-ID migration test verifies the PR's merge base.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Format check (ruff)
        run: uv run ruff format --check

      - name: Type-check (mypy)
        run: uv run mypy --package panopticon

      - name: Test (pytest)
        # The standalone 2119 gate is temporarily manual; keep its repository-policy meta-test
        # out of general CI until the verdict baseline is reset.
        run: uv run pytest --ignore=tests/test_2119_file_scoped_ids.py

      - name: Build wheel
        run: uv build --wheel

      - name: Smoke-test clean wheel
        run: |
          uv venv --python 3.13 .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          cd /tmp
          actual_version=$("$GITHUB_WORKSPACE/.wheel-venv/bin/panopticon" --version)
          expected_version=$("$GITHUB_WORKSPACE/.wheel-venv/bin/python" -c 'from importlib.metadata import version; print("panopticon " + version("panopticon-next"))')
          test "$actual_version" = "$expected_version"
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -c "from pathlib import Path; from panopticon.taskservice.__main__ import build_app; app = build_app(db='sqlite+aiosqlite:///:memory:', artifacts_root='/tmp/panopticon-artifacts', layers_root='/tmp/panopticon-layers', _home_workflows=Path('/tmp/panopticon-workflows')); assert any(route.path == '/healthz' for route in app.routes)"
